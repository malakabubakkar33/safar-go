<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none">
  <defs>
    <style>
      .primary-safar {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #0F172A;
        letter-spacing: -0.03em;
        text-anchor: middle;
      }
      .primary-go {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #16A34A;
        letter-spacing: -0.03em;
      }
      .primary-tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #64748B;
        letter-spacing: 0.22em;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Large Central Symbol -->
  <g transform="translate(100, 16) scale(1.0)">
    <path d="M 32 78 L 64 78 A 14 14 0 0 0 78 64 A 14 14 0 0 0 64 50 L 36 50 A 14 14 0 0 1 22 36 A 14 14 0 0 1 36 22 L 68 22" 
          stroke="#16A34A" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 64 9.5 L 83 22 L 64 34.5 Z" 
          fill="#16A34A"
          stroke="#16A34A"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- Brand Wordmark Centered -->
  <text x="150" y="172" class="primary-safar">Safar<tspan class="primary-go">Go</tspan></text>

  <!-- Tagline -->
  <text x="150" y="202" class="primary-tagline">YOUR RIDE, YOUR WAY</text>
</svg>
