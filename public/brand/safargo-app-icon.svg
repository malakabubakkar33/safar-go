<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    
    <!-- Ambient Inner Highlight -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Symbol Shadow -->
    <filter id="symbolShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#iconBg)"/>
  <rect width="512" height="512" rx="115" fill="url(#innerGlow)"/>

  <!-- Centered White Symbol -->
  <g transform="translate(106, 106) scale(3.0)" filter="url(#symbolShadow)">
    <path d="M 32 78 L 64 78 A 14 14 0 0 0 78 64 A 14 14 0 0 0 64 50 L 36 50 A 14 14 0 0 1 22 36 A 14 14 0 0 1 36 22 L 68 22" 
          stroke="#FFFFFF" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 64 9.5 L 83 22 L 64 34.5 Z" 
          fill="#FFFFFF"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>
</svg>
